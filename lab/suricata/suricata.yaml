%YAML 1.1
---
# Minimal Suricata 8 config for the lab sensor only (the test runner uses Suricata's default
# config with --set overrides, like production). Mounted read-only from the repo, so the sensor
# does not need to read the image's own root-unreadable /etc/suricata files.

vars:
  address-groups:
    HOME_NET: "[10.10.1.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
    OT_NET: "[10.10.1.10,10.10.1.11]"  # plc-modbus, dnp3-outstation
    OT_WRITERS: "[10.10.1.20]"      # hmi
    ENG_WS: "[10.10.1.30]"          # engineering workstation slot (unused)
    DNP3_MASTERS: "[10.10.1.40]"    # dnp3-master
    IT_NET: "[10.10.1.128/25]"      # IT network slot (unused)
  port-groups: {}

default-log-dir: /var/log/suricata
classification-file: /etc/suricata/lab/classification.config
reference-config-file: /etc/suricata/lab/reference.config
threshold-file: /etc/suricata/lab/threshold.config

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - flow
        - stats:
            totals: yes
            threads: no

stats:
  enabled: yes
  interval: 8

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes

# Don't try to change NIC offload settings: that needs NET_ADMIN, which the sensor doesn't have.
# Harmless on the virtual bridge (checksums are ignored with -k none, and the TCP stream engine
# reassembles merged segments).
capture:
  disable-offloading: false

af-packet:
  - interface: otlab0
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes

app-layer:
  protocols:
    modbus:
      enabled: yes
      detection-ports:
        dp: 502
    dnp3:
      enabled: yes
      detection-ports:
        dp: 20000
    enip:
      enabled: yes
      detection-ports:
        dp: 44818
        sp: 44818

# stream.reassembly.depth is left at Suricata's default (1 MiB per direction), as in production.
# Measured on 8.0.7: Modbus and DNP3 commands after the first 1 MiB of one connection are not seen,
# and app-layer.protocols.modbus.stream-depth does not change that (tests: lab_*_long_session*).
# The lab HMI sends ~24 B/s to the PLC and the DNP3 master ~12 B/s, so their own connections reach
# 1 MiB after ~12 h and ~24 h; restart them (make lab-down && make lab-up) for longer exercises.
stream:
  midstream: true

security:
  lua:
    allow-rules: false

unix-command:
  enabled: no
