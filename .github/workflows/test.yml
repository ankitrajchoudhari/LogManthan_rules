name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks scan (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

      # Production runs Suricata 8.0.7, so tests run in that exact image, pinned by digest.
      - name: Lint + static + dynamic tests (Suricata 8.0.7 container)
        env:
          SURICATA_IMAGE: "jasonish/suricata@sha256:bf4bea5b45d9c10265a3ee6628e2ec8930b9d1fb7caf9d1afb63af413b9cbb26"  # 8.0.7
        run: |
          docker run --rm -v "$PWD:/src" -w /src --entrypoint suricata "$SURICATA_IMAGE" -V
          docker run --rm -v "$PWD:/src" -w /src --entrypoint python3 "$SURICATA_IMAGE" scripts/test_suricata.py

      # The Sigma test events must be exactly what Suricata produces from our lab captures today.
      - name: Sigma test events are up to date (Suricata 8.0.7 container)
        env:
          SURICATA_IMAGE: "jasonish/suricata@sha256:bf4bea5b45d9c10265a3ee6628e2ec8930b9d1fb7caf9d1afb63af413b9cbb26"  # 8.0.7
        run: |
          docker run --rm -v "$PWD:/src" -w /src --entrypoint python3 "$SURICATA_IMAGE" scripts/build_sigma_events.py --check

      # Sigma tools from sigma/requirements.txt only, every file verified by SHA-256.
      - name: Sigma check + correlation tests
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes -r sigma/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" scripts/test_sigma.py
