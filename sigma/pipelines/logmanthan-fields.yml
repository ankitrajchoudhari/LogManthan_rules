# Field names: the ONE place they are defined for LogManthan.
#
# The Sigma rules in sigma/rules/ use the logical names on the left: the Suricata alert fields that
# LogManthan's Sigma engine is known to see (signature_id, msg, src_ip, dest_ip, ports, timestamp).
# The names on the right are what LogManthan actually calls them.
#
# TODO(rajeev): confirm field names. Each right-hand value below is a placeholder equal to the
#   logical name, NOT a confirmed LogManthan field. Replace each with the real name (for example
#   alert.signature_id if LogManthan keeps eve.json nesting). Also confirm:
#   - the logsource the rules should use (they say product: suricata, service: alert);
#   - how LogManthan loads Sigma: if it reads rules directly rather than through a pySigma
#     conversion, the rules themselves need the confirmed names (sed over sigma/rules/).
#
# The test suite (scripts/test_sigma.py) fails if a rule uses a field that is not listed here, so
# this file stays the complete list to confirm.
#
# Format: pySigma processing pipeline, usable with sigma-cli, e.g.
#   sigma convert -t <backend> -p sigma/pipelines/logmanthan-fields.yml sigma/rules
name: LogManthan Suricata alert field names
priority: 20
transformations:
  - id: logmanthan_field_names
    type: field_name_mapping
    mapping:
      timestamp: timestamp
      signature_id: signature_id
      msg: msg
      src_ip: src_ip
      src_port: src_port
      dest_ip: dest_ip
      dest_port: dest_port
