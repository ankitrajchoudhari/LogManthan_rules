# Field names: the ONE place they are defined for LogManthan.
#
# Left: the field in Suricata's eve.json alert. Right: the name LogManthan's Sigma engine uses for it.
# Confirmed by Rajeev on LogManthan's Sigma engine (all 18 correlation scenarios replayed there:
# 36/36 checks match).
#
# The Sigma rules in sigma/rules/ are written with the LogManthan names (right-hand side), because
# LogManthan loads the rules as they are. This mapping is for anyone converting a rule written with
# eve.json names:
#   sigma convert -t <backend> -p sigma/pipelines/logmanthan-fields.yml <rule>
#
# metadata.product.name is set by LogManthan, not taken from eve.json, so it has no left-hand side.
# Every base rule requires metadata.product.name: Suricata, because Wazuh rule IDs share
# metadata.event_code with Suricata SIDs.
#
# The test suite (scripts/test_sigma.py) fails if a rule uses a field that is not listed here
# (a right-hand value, or metadata.product.name). Only fields the rules use are listed; add a new one
# only after it is confirmed on LogManthan.
name: LogManthan Suricata alert field names
priority: 20
transformations:
  - id: logmanthan_field_names
    type: field_name_mapping
    mapping:
      signature_id: metadata.event_code
      src_ip: src_endpoint.ip
